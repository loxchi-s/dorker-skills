name: Local AI Workbench

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Review instruction (optional)
        required: false
        type: string
        default: "Review this change for correctness, security, reliability, and missing tests."
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      prompt:
        description: Review instruction
        required: false
        type: string
        default: "Review this change for correctness, security, reliability, and missing tests."
      implementation_ref:
        description: Full 40-character commit SHA for the Workbench implementation (must match the reusable workflow ref)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: local-ai-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Workbench implementation
        shell: bash
        env:
          IMPLEMENTATION_REF: ${{ inputs.implementation_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" == "loxchi-s/dorker-skills" ]]; then
            # In-repository PRs are tested from their checked-out revision.
            echo "WORKBENCH_DIR=$GITHUB_WORKSPACE/workbench" >> "$GITHUB_ENV"
          else
            # External callers must provide the same immutable SHA used in the reusable-workflow reference.
            if [[ ! "$IMPLEMENTATION_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::implementation_ref must be a full lowercase 40-character commit SHA."
              exit 1
            fi
            workbench_dir="$RUNNER_TEMP/dorker-workbench"
            git init "$workbench_dir"
            git -C "$workbench_dir" remote add origin https://github.com/loxchi-s/dorker-skills.git
            git -C "$workbench_dir" fetch --depth=1 origin "$IMPLEMENTATION_REF"
            fetched_sha="$(git -C "$workbench_dir" rev-parse FETCH_HEAD)"
            if [[ "$fetched_sha" != "$IMPLEMENTATION_REF" ]]; then
              echo "::error::Fetched Workbench revision does not match implementation_ref."
              exit 1
            fi
            git -C "$workbench_dir" checkout --detach FETCH_HEAD
            echo "WORKBENCH_DIR=$workbench_dir/workbench" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit test local inference client
        working-directory: ${{ env.WORKBENCH_DIR }}
        run: python -m unittest -v

      - name: Start resource-limited local Ollama
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name local-ollama --cpus=2 --memory=4g --pids-limit=256 -p 127.0.0.1:11434:11434 ollama/ollama:0.6.8
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
          docker exec local-ollama ollama pull qwen2.5:1.5b

      - name: Run local model review
        env:
          LOCAL_AI_PROMPT: ${{ inputs.prompt || 'Review this change for correctness, security, reliability, and missing tests.' }}
          LOCAL_AI_MODEL: qwen2.5:1.5b
          LOCAL_AI_REPORT: ${{ runner.temp }}/local-ai-report.md
          OLLAMA_URL: http://127.0.0.1:11434
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python "$WORKBENCH_DIR/local_ai.py"

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-review-${{ github.run_id }}
          path: ${{ runner.temp }}/local-ai-report.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local model container
        if: always()
        run: docker rm -f local-ollama || true
