name: Dorker Agent Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dorker_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dorker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DORKER_TEST_POSTGRES_DSN: postgresql://remote_audit_login:ci-only-password@localhost:5432/dorker_test
      DORKER_TEST_POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/dorker_test
      DORKER_TEST_POSTGRES_ROLE: remote_audit_login
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Agent Lab dependencies
        run: python -m pip install --requirement agent-lab/requirements.txt
      - name: Validate skill registry
        run: python tools/validate_registry.py --root .
      - name: Run registry tests
        run: python -m unittest discover -s tests -v
      - name: Prepare PostgreSQL test schema
        run: |
          PGPASSWORD=postgres psql "postgresql://postgres@localhost:5432/dorker_test" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
          PGPASSWORD=postgres psql "postgresql://postgres@localhost:5432/dorker_test" -v ON_ERROR_STOP=1 -f agent-lab/postgres/001_remote_audit_schema.sql
          PGPASSWORD=postgres psql "postgresql://postgres@localhost:5432/dorker_test" -v ON_ERROR_STOP=1 -f agent-lab/postgres/002_remote_audit_app_role.sql
          # Reapply both migrations to verify safe idempotent reruns.
          PGPASSWORD=postgres psql "postgresql://postgres@localhost:5432/dorker_test" -v ON_ERROR_STOP=1 -f agent-lab/postgres/001_remote_audit_schema.sql
          PGPASSWORD=postgres psql "postgresql://postgres@localhost:5432/dorker_test" -v ON_ERROR_STOP=1 -f agent-lab/postgres/002_remote_audit_app_role.sql
          PGPASSWORD=postgres psql "postgresql://postgres@localhost:5432/dorker_test" -v ON_ERROR_STOP=1 -c "CREATE ROLE remote_audit_login LOGIN INHERIT PASSWORD 'ci-only-password'; GRANT remote_audit_app TO remote_audit_login;"
      - name: Run agent lab tests
        run: python -m unittest discover -s agent-lab/tests -v
      - name: Compile agent lab
        run: python -m compileall -q agent-lab
      - name: Prepare local image for Docker integration tests
        run: |
          docker info
          docker pull python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          IMAGE_ID="$(docker image inspect python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b --format '{{.Id}}')"
          echo "DORKER_TEST_IMAGE=$IMAGE_ID" >> "$GITHUB_ENV"
      - name: Run real Docker daemon integration tests
        run: python -m unittest discover -s agent-lab/tests -p 'test_docker_integration.py' -v
