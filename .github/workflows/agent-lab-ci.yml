name: Dorker Agent Lab CI

on:
  push:
    branches: [main]
    paths:
      - "agent-lab/**"
      - "tools/**"
      - "catalog.json"
      - ".github/workflows/agent-lab-ci.yml"
  pull_request:
    paths:
      - "agent-lab/**"
      - "tools/**"
      - "catalog.json"
      - ".github/workflows/agent-lab-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-lab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Agent Lab dependencies
        run: python -m pip install --requirement agent-lab/requirements.txt
      - name: Validate skill registry
        run: python tools/validate_registry.py --root .
      - name: Run registry tests
        run: python -m unittest discover -s tests -v
      - name: Run agent lab tests
        run: python -m unittest discover -s agent-lab/tests -v
      - name: Compile agent lab
        run: python -m compileall -q agent-lab
      - name: Prepare local image for Docker integration tests
        run: |
          docker info
          docker pull python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          IMAGE_ID="$(docker image inspect python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b --format '{{.Id}}')"
          echo "DORKER_TEST_IMAGE=$IMAGE_ID" >> "$GITHUB_ENV"
      - name: Run real Docker daemon integration tests
        run: python -m unittest discover -s agent-lab/tests -p 'test_docker_integration.py' -v
